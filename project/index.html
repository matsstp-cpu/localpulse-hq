<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LocalPulse TEAM HUB" />
    <meta name="theme-color" content="#070A14" />
    <title>LocalPulse TEAM HUB</title>
    <meta name="description" content="Cyber-Chic панель LocalPulse TEAM HUB: команда, лента, календарь." />
    
    <!-- Иконки и Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/localpulse-192.svg" />
    <link rel="apple-touch-icon" href="/icons/localpulse-192.svg" />
    <link rel="mask-icon" href="/icons/localpulse-192.svg" color="#3B82F6" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="LocalPulse TEAM HUB" />
    <meta property="og:description" content="Панель управления командой LocalPulse TEAM HUB" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1200&h=630&fit=crop" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LocalPulse TEAM HUB" />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1200&h=630&fit=crop" />
    
    <!-- PWA Manifest с исправлением ошибки 401 -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('SW registered'))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
